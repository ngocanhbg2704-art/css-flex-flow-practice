<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS flex-flow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Ví dụ 1: flex-flow: row nowrap (Trái qua phải, không xuống dòng)</h2>
    <div class="container-1">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>

    <h2>Ví dụ 2: flex-flow: row-reverse nowrap (Phải qua trái, không xuống dòng)</h2>
    <div class="container-2">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>

</body>
</html>
